---
layout: base
---
<div class='posts'>
  <div class='post-listing'>
    {% assign years = site.posts | group_by_exp: "post", "post.date | date: '%Y'" %}
    {% for year in years %}
      <div class="year">
        <h3>{{ year.name }}</h3>
          {% for post in year.items %}
              {% include post-archive-loop.html %}
          {% endfor %}
      </div>
    {% endfor %}
  </div>
</div>
